  « Classements » est **la seule source exacte des séries admises** : le champ
  `clt` de la recherche ne rend que des familles, et se trompe — ce tournoi-ci
  s'y annonce `N` alors que la fiche exclut N1. Une famille non admise porte une
  croix ; NC, qui n'a qu'un niveau, porte une coche sans rang.

  « Tableaux » nomme les tableaux réels — SH, SD, DH, DD, MX —, une colonne
  chacun. Le libellé qui suit le code dit tout et son contraire selon
  l'organisateur : « oui » ici, mais « Série 1 », « P10-NC » ou « U13-Ben »
  ailleurs, et un même code revient autant de fois qu'il a de séries. C'est le
  code qu'on lit, et lui seul. Les attributs de style sont retirés, les lignes
  de journées réduites à une : ni l'un ni l'autre ne se lit.
-->
